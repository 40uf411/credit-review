name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.5"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check --output-format=github .
      - name: Pyright
        run: uv run pyright

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked
      # No model or network is needed: the pipeline replays the hand-labelled reference values.
      - name: Pytest
        env:
          CREDIT_REVIEW_LLM_OFFLINE: "1"
        run: uv run pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (Python ${{ matrix.python }})"
            echo '```'
            uv run coverage report --skip-covered --skip-empty 2>/dev/null | tail -n 25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-py${{ matrix.python }}
          path: |
            coverage.xml
            junit.xml
          retention-days: 14

  policy:
    name: Policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - name: Install
        run: uv sync --locked --no-default-groups
      # Every rule must trace to the policy text verbatim and every reference must resolve.
      # A policy that fails here can never be merged.
      - name: Validate every policy
        run: |
          status=0
          for f in policy/*.yaml; do
            echo "### \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            uv run --no-sync python -m credit_review.policy "$f" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

  licences:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
      - name: Install runtime dependencies only
        run: uv sync --locked --no-default-groups
      # Copyleft licences fail the build. PyMuPDF (AGPL) is a known, documented exception:
      # see docs/adr/0001-pdf-library-licence.md.
      - name: Check licences
        run: |
          uv run --no-sync --with pip-licenses pip-licenses --partial-match \
            --fail-on="GNU General Public License;AFFERO;AGPL" --ignore-packages pymupdf \
            --format=markdown --order=license | tee -a "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
