name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR (main only)
      security-events: write   # upload scan results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once into the local daemon so the exact image can be tested and scanned before it is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: credit-review:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm credit-review:ci credit-review --help
          docker run --rm credit-review:ci python -m credit_review.policy policy/example_bank_v3.2.yaml
          test "$(docker run --rm credit-review:ci id -u)" != "0"
          docker run --rm credit-review:ci sh -c '! python -c "import pip" 2>/dev/null'   # no pip at run time
          # The service starts, answers its health check and refuses requests without the key.
          docker run -d --name api -p 8000:8000 -e CREDIT_API_KEY=smoke credit-review:ci
          trap 'docker logs api; docker rm -f api > /dev/null' EXIT
          for _ in $(seq 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          expect() {   # expect <status> <path>
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8000$2")
            [ "$code" = "$1" ] || { echo "::error::GET $2 answered $code, expected $1"; exit 1; }
          }
          expect 401 /dossiers/000000000000000000000000
          expect 200 /readyz
          # The same image serves the assistant when APP_MODULE says so (not ready: no Azure endpoints here).
          docker run -d --name assistant -p 8001:8000 -e CREDIT_API_KEY=smoke -e APP_MODULE=assistant.api:app credit-review:ci
          trap 'docker logs api; docker logs assistant; docker rm -f api assistant > /dev/null' EXIT
          for _ in $(seq 30); do curl -fsS localhost:8001/healthz && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8001/conversations)
          [ "$code" = 401 ] || { echo "::error::assistant without a key answered $code, expected 401"; exit 1; }
          # And the analyst page (Streamlit) when APP_MODULE=analyst: it starts, is healthy and serves its page.
          docker run -d --name analyst -p 8002:8000 -e CREDIT_API_KEY=smoke -e CREDIT_REVIEW_UI_HOSTED=1 \
            -e APP_MODULE=analyst credit-review:ci
          trap 'docker logs api; docker logs assistant; docker logs analyst; docker rm -f api assistant analyst > /dev/null' EXIT
          for _ in $(seq 30); do curl -fsS localhost:8002/_stcore/health && break; sleep 1; done
          curl -fsS localhost:8002/_stcore/health
          curl -fsS localhost:8002/ | grep -q '<div id="root">' || { echo "::error::the analyst page did not load"; exit 1; }

      # Vulnerabilities only. Secrets in our own code are caught by gitleaks in CI; the image's secret scanner
      # flags placeholder text in third-party SDK docstrings, which is noise rather than findings.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-review:ci
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true

      - name: Upload scan to code scanning
        # Fork PRs get a read-only token, so they skip the upload.
        if: always() && hashFiles('trivy-image.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Fixable HIGH and CRITICAL vulnerabilities fail the build.
      - name: Scan image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: credit-review:ci
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_SKIP_DB_UPDATE: "true"   # reuse the database downloaded by the report step

      - name: Scan Dockerfile
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build inputs and cache, so this reuses the layers that were just tested and scanned.
      - name: Publish
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Image summary
        if: steps.push.outcome == 'success'
        run: |
          {
            echo "### Published"
            echo "\`${IMAGE}@${{ steps.push.outputs.digest }}\`"
            echo
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
