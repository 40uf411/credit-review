name: Infrastructure

# Terraform for infra/: checked on every PR that touches it, with the plan posted on the PR; applied on main.
# Signs in to Azure with OIDC (the bootstrap's identity); no key or password is stored anywhere.
# Needs repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, TFSTATE_RG, TFSTATE_ACCOUNT,
# MODEL_USER_OBJECT_IDS (your Entra object id, or a list; [] for none) and optionally BUDGET_EMAILS.

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One Terraform run at a time against the state; never cancel an apply halfway.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  checks:
    name: Format, validate, scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # the scan's SARIF report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive -diff infra
      - name: Validate
        run: |
          for dir in infra/bootstrap infra; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done
      # Misconfiguration scan, reported to code scanning rather than failing the build: the accepted findings
      # (public endpoints instead of private ones, no geo-redundancy) are listed in docs/adr/0002-container-apps.md.
      - name: Scan configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-config.sarif
      - name: Upload scan to code scanning
        if: always() && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  plan:
    name: Plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # OIDC sign-in to Azure
      pull-requests: write     # the plan comment
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # List variables, written to the environment as JSON lists. The repository variables are accepted as a JSON list,
      # one value, or comma-separated values, so a missing quote or a pasted smart quote is not a failed run.
      - name: Variables
        env:
          OBJECT_IDS: ${{ vars.MODEL_USER_OBJECT_IDS }}
          EMAILS: ${{ vars.BUDGET_EMAILS }}
          TFSTATE_RG: ${{ vars.TFSTATE_RG }}
          TFSTATE_ACCOUNT: ${{ vars.TFSTATE_ACCOUNT }}
        run: |
          missing=""
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TFSTATE_RG TFSTATE_ACCOUNT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Empty:$missing. Set AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, TFSTATE_RG and TFSTATE_ACCOUNT as *repository* variables (Settings → Secrets and variables → Actions → Variables), not only on an environment: the plan on a PR runs outside any environment."; exit 1; }
          as_list() { jq -cn --arg v "$1" '$v | gsub("[\\[\\]\"“”‘’'"'"']"; "") | split("[,;\\s]+"; null) | map(select(length > 0))'; }
          [ -n "$OBJECT_IDS" ] || { echo "::error::Set the repository variable MODEL_USER_OBJECT_IDS (your Entra object id; [] for none), or a plan would remove the access it grants."; exit 1; }
          echo "TF_VAR_model_user_object_ids=$(as_list "$OBJECT_IDS")" >> "$GITHUB_ENV"
          echo "TF_VAR_budget_emails=$(as_list "$EMAILS")" >> "$GITHUB_ENV"
          echo "Model users: $(as_list "$OBJECT_IDS" | jq length) · budget e-mails: $(as_list "$EMAILS" | jq length)"
      - name: Init
        run: >
          terraform init -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate" -backend-config="key=dev.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
          summary=$(grep -E '^(Plan:|No changes\.)' plan.txt | tail -1)
          {
            echo "<!-- tf-plan -->"
            echo "### Terraform plan for \`dev\`"
            echo
            echo "**${summary:-See the job log.}** (commit ${GITHUB_SHA:0:7}; applied when merged to main)"
            echo
            echo "<details><summary>Plan</summary>"
            echo
            echo '```'
            terraform show -no-color tfplan | grep -vE '^\s*$' | head -c 60000
            echo '```'
            echo "</details>"
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/comment.md';
            const body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8')
              : '<!-- tf-plan -->\n### Terraform plan for `dev`\n\n**The plan failed.** See the job log.';
            const marker = '<!-- tf-plan -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: Apply
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write          # OIDC sign-in to Azure
      actions: write           # start a deployment, so app settings changed here go live
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # List variables, written to the environment as JSON lists. The repository variables are accepted as a JSON list,
      # one value, or comma-separated values, so a missing quote or a pasted smart quote is not a failed run.
      - name: Variables
        env:
          OBJECT_IDS: ${{ vars.MODEL_USER_OBJECT_IDS }}
          EMAILS: ${{ vars.BUDGET_EMAILS }}
          TFSTATE_RG: ${{ vars.TFSTATE_RG }}
          TFSTATE_ACCOUNT: ${{ vars.TFSTATE_ACCOUNT }}
        run: |
          missing=""
          for v in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID TFSTATE_RG TFSTATE_ACCOUNT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Empty:$missing. Set AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, TFSTATE_RG and TFSTATE_ACCOUNT as *repository* variables (Settings → Secrets and variables → Actions → Variables), not only on an environment: the plan on a PR runs outside any environment."; exit 1; }
          as_list() { jq -cn --arg v "$1" '$v | gsub("[\\[\\]\"“”‘’'"'"']"; "") | split("[,;\\s]+"; null) | map(select(length > 0))'; }
          [ -n "$OBJECT_IDS" ] || { echo "::error::Set the repository variable MODEL_USER_OBJECT_IDS (your Entra object id; [] for none), or the apply would remove the access it grants."; exit 1; }
          echo "TF_VAR_model_user_object_ids=$(as_list "$OBJECT_IDS")" >> "$GITHUB_ENV"
          echo "TF_VAR_budget_emails=$(as_list "$EMAILS")" >> "$GITHUB_ENV"
          echo "Model users: $(as_list "$OBJECT_IDS" | jq length) · budget e-mails: $(as_list "$EMAILS" | jq length)"
      - name: Init
        run: >
          terraform init -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}"
          -backend-config="container_name=tfstate" -backend-config="key=dev.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan | tee plan.txt
      - name: Apply
        run: terraform apply -lock-timeout=5m -no-color tfplan
      - name: Outputs
        run: |
          { echo "### Applied"; echo; echo '```'; grep -E '^(Plan:|No changes\.)' plan.txt || true;
            terraform output -no-color github_variables; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # In multiple-revision mode, a settings change makes a revision with no traffic. The deployment tests it on
      # its label and promotes it, exactly as for a new image.
      - name: Start a deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q 'azurerm_container_app.api will be updated' plan.txt; then
            gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY"
            echo "App settings changed: deployment started." >> "$GITHUB_STEP_SUMMARY"
          fi
