[project]
name = "credit-review"
version = "0.1.0"
description = "Reads a mortgage dossier, checks it against a credit policy, and reports every finding with its evidence."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "anthropic>=0.40",
    "openai>=1.40",
    "azure-identity>=1.19",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "azure-storage-blob>=12.31.0",
    "opentelemetry-api>=1.45.1",
    "azure-monitor-opentelemetry>=1.8.11",
    "httpx>=0.28.1",
]

[project.scripts]
credit-review = "credit_review.pipeline:main"

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
lint = ["ruff>=0.6", "pyright>=1.1.380", "types-PyYAML>=6.0"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credit_review", "assistant"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["credit_review", "assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Raised as coverage grows; CI fails below it.
fail_under = 80

# ---------------------------------------------------------------- lint

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "E501",    # long lines: the existing code keeps related logic on one line; the formatter is not applied
    "E741",    # single-letter names such as `l` are used deliberately in parsing code
    "E731",    # small named lambdas are used as local helpers
    "B905",    # zip(strict=...) would change behaviour; lengths are checked where they matter
    "SIM102",  # nested ifs are kept where each condition reads as its own rule
    "SIM105",  # try/except/pass is as clear as contextlib.suppress
    "SIM108",  # ternaries are not always clearer
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]   # assert is how pytest works; fake credentials in tests

[tool.pyright]
include = ["credit_review", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
# Values that are optional in a model but guaranteed after validation are not narrowed everywhere
# yet. They are reported as warnings so they stay visible; everything else is an error.
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOptionalOperand = "warning"
